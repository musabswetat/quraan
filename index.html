<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصحف سورة الكهف</title>

    <!-- الربط مع ملف التثبيت المباشر -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سورة الكهف">
    <meta name="theme-color" content="#064E3B">

    <style>
        :root {
            --bg-base: #F7F5F0;
            --bg-card: #FFFFFF;
            --border-color: #E6E0D5;
            --gold-primary: #9A7B38;
            --gold-light: #FBF7EC;
            --emerald: #064E3B;
            --text-main: #1C1917;
            --text-muted: #6B7280;
            --shadow: 0 20px 40px -15px rgba(28, 25, 23, 0.08);
            --radius: 28px;
        }

        body.dark-mode {
            --bg-base: #0B0F17;
            --bg-card: #131C2E;
            --border-color: rgba(212, 175, 55, 0.15);
            --gold-primary: #D4AF37;
            --gold-light: rgba(212, 175, 55, 0.08);
            --emerald: #10B981;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Traditional Arabic", "Amiri", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 16px 140px 16px;
            transition: background 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            padding: 6px 0;
        }

        .app-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--gold-primary);
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .progress-indicator {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .quran-manuscript-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 34px 22px 26px 22px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            transition: transform 0.15s ease-out;
            cursor: grab;
        }

        .quran-manuscript-card:active { cursor: grabbing; }

        .quran-manuscript-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .verse-number-frame {
            display: inline-block;
            background: var(--gold-light);
            color: var(--gold-primary);
            border: 1px solid var(--border-color);
            padding: 5px 18px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .quran-ayah-text {
            font-size: 32px;
            font-weight: 700;
            line-height: 2.4;
            color: var(--text-main);
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-bottom: 18px;
            direction: rtl;
        }

        .swipe-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
            opacity: 0.7;
        }

        .tafsir-box-wrapper {
            margin-top: 14px;
            text-align: right;
            border-top: 1px dashed var(--border-color);
            padding-top: 14px;
        }

        .tafsir-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tafsir-body {
            background: var(--gold-light);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.85;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .primary-actions {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1.3fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .fast-navigation-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: var(--border-color); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-main-next {
            background: linear-gradient(135deg, var(--emerald) 0%, #047857 100%);
            color: #FFFFFF;
            border: none;
        }

        .btn-bookmark {
            color: var(--gold-primary);
            border-color: var(--gold-primary);
            background: var(--gold-light);
        }
        .btn-bookmark.bookmarked {
            background: var(--gold-primary);
            color: #FFFFFF;
        }

        .btn-jump {
            font-size: 12px;
            padding: 10px 4px;
            color: var(--gold-primary);
            background: var(--bg-card);
        }

        .bottom-tools-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .tool-btn {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s;
        }
        .tool-btn:active { transform: scale(0.96); }

        .review-panel { display: none; }
        .review-panel.active { display: block; }
        .reader-panel.hidden { display: none; }

        .review-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        .review-item:hover { border-color: var(--gold-primary); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="app-title">📖 سورة الكهف المباركة</div>
        </header>

        <div class="reader-panel" id="readerPanel">
            <div class="progress-indicator">
                <span id="progressLabel" style="font-weight: 800; font-size: 14px; color: var(--gold-primary);">الآية 1 من 110</span>
                <span style="font-size: 13px; color: var(--text-muted);">حفظ وتدبر</span>
            </div>

            <div class="quran-manuscript-card" id="quranCardArea">
                <span class="verse-number-frame" id="verseNumDisplay">الآية 1</span>
                
                <div class="quran-ayah-text" id="ayahTextDisplay">
                    الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا ۜ
                </div>

                <div class="swipe-hint">↔ اسحب لليمين أو اليسار للتنقل بين الآيات</div>

                <div class="tafsir-box-wrapper">
                    <div class="tafsir-title">📖 معاني الكلمات والتفسير الميسر:</div>
                    <div class="tafsir-body" id="tafsirBodyContent">
                        جاري التحميل...
                    </div>
                </div>
            </div>

            <div class="primary-actions">
                <button class="action-btn btn-main-next" id="nextBtnNode" onclick="navigateVerses(1)">التالي ➔</button>
                <button class="action-btn btn-bookmark" id="bookmarkBtnNode" onclick="toggleBookmarkCurrent()">⭐ حفظ</button>
                <button class="action-btn" id="prevBtnNode" onclick="navigateVerses(-1)">🠔 السابق</button>
            </div>

            <div class="fast-navigation-grid">
                <button class="action-btn btn-jump" onclick="jumpStep(10)">+10</button>
                <button class="action-btn btn-jump" onclick="jumpStep(5)">+5</button>
                <button class="action-btn btn-jump" onclick="jumpStep('start')" style="font-weight: 800;">البداية</button>
                <button class="action-btn btn-jump" onclick="jumpStep(-5)">-5</button>
                <button class="action-btn btn-jump" onclick="jumpStep(-10)">-10</button>
            </div>

            <div class="bottom-tools-bar">
                <button class="tool-btn" id="viewToggleBtn" onclick="toggleReviewView()">⭐ المحفوظات (<span id="savedCounter">0</span>)</button>
                <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">☀️ نهاري</button>
                <button class="tool-btn" onclick="installToLauncher()" id="installBtn">📲 تثبيت التطبيق</button>
            </div>
        </div>

        <div class="review-panel" id="reviewPanel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="font-size: 18px; font-weight: 800; color: var(--gold-primary);">⭐ الآيات المحفوظة للمراجعة</h2>
                <button class="tool-btn" onclick="toggleReviewView()">📖 العودة للمصحف</button>
            </div>
            <div id="reviewItemsContainer"></div>
        </div>
    </div>

    <script>
        const quranAlKahfData = [
            { id: 1, text: "الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا ۜ", tafseer: "الثناء الكامل لله الذي أنزل القرآن على نبيه محمد ﷺ وجعله مستقيماً لا تناقض فيه ولا عوج." },
            { id: 2, text: "قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا", tafseer: "مستقيماً لا ميل فيه، ليخوف الكافرين من عذاب شديد، ويبشر المؤمنين الصالحين بالجنة." },
            { id: 3, text: "مَّاكِثِينَ فِيهِ أَبَدًا", tafseer: "مقيمين في ذلك النعيم والفضل العظيم خلوداً دائماً لا يزول." },
            { id: 4, text: "وَيُنذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا", tafseer: "وليحذر ويعاقب المشركين واليهود والنصارى الذين نسبوا لله الولد تعالى الله عن ذلك." },
            { id: 5, text: "مَّا لَهُم بِهِ مِنْ عِلْمٍ وَلَا لِآبَائِهِمْ ۚ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَاهِهِمْ ۚ إِن يَقُولُونَ إِلَّا كَذِبًا", tafseer: "ليس لديهم برهان على قولهم، عظمت شناعة هذه المقالة الجائرة وما ينطقون إلا كذباً وافتراءً." },
            { id: 6, text: "فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلَىٰ آثَارِهِمْ إِن لَّمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا", tafseer: "لعلك يا محمد مهلك نفسك حزناً وأسفاً على إعراض قومك وعدم تصديقهم بالقرآن." },
            { id: 7, text: "إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا", tafseer: "جعلنا ما على وجه الأرض من زينة ومتاع اختباراً للعباد: أيهم أطوع وأخلص عملاً لله." },
            { id: 8, text: "وَإِنَّا لَجَاعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا", tafseer: "وإنا لمصيّرون جميع ما على الأرض عند قيام الساعة تراباً يابساً قاحلاً لا نبات فيه." },
            { id: 9, text: "أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا", tafseer: "هل ظننت أن قصة أصحاب الكهف واللوح المكتوب فيه خبرهم هي أعجب آياتنا؟ بل آيات الله كلها عظيمة." },
            { id: 10, text: "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", tafseer: "حين لجأ الشباب المؤمنون إلى الغار فراراً بدينهم، ودعوا الله أن يمنحهم رحمة ويثبتهم على الهداية." },
            { id: 11, text: "فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا", tafseer: "فألقينا عليهم نوماً عميقاً ثقيلاً حجب عنهم الأصوات سنين كثيرة." },
            { id: 12, text: "ثُمَّ بَعَثْنَاهُمْ لِنَعْلَمَ أَيُّ الْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوا أَمَدًا", tafseer: "ثم أيقظناهم من نومهم لنُظهر للناس أي الفريقين المتنازعين أضبط لحساب مدة مكثهم." },
            { id: 13, text: "نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِالْحَقِّ ۚ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى", tafseer: "نحن نخبرك بقصتهم الصادقة بالحق، إنهم شباب صدقوا بالله وزادهم الله توفيقاً وثباتاً." },
            { id: 14, text: "وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا فَقَالُوا رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ لَن نَّدْعُوَ مِن دُونِهِ إِلَٰهًا ۖ لَّقَدْ قُلْنَا إِذًا شَطَطًا", tafseer: "وقوينا قلوبهم بالصبر حين قاموا أمام الملك الكافر معلنين: ربنا خالق السموات والأرض ولن نعبد سواه أبداً." },
            { id: 15, text: "هَٰؤُلَاءِ قَوْمُنَا اتَّخَذُوا مِن دُونِهِ آلِهَةً ۖ لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَانٍ بَيِّنٍ ۖ فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا", tafseer: "قال الفتية: هؤلاء قومنا عبدوا غير الله بلا حجة بيّنة، فمن أشد ظلماً ممن اختلق الكذب على الله؟" },
            { id: 16, text: "وَإِذِ اعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا اللَّهَ فَأْوُوا إِلَى الْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًا", tafseer: "وحين فارقتموهم وما يعبدون إلا الله، فالجؤوا إلى الكهف يسبغ عليكم ربكم رحمته وييسر لكم أسباب العيش." },
            { id: 17, text: "وَتَرَى الشَّمْسَ إِذَا طَلَعَت تَّزَاوَرُ عَن كَهْفِهِمْ ذَاتَ الْيَمِينِ وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ الشِّمَالِ وَهُمْ فِي فَجْوَةٍ مِّنْهُ ۚ ذَٰلِكَ مِنْ آيَاتِ اللَّهِ ۗ مَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُ وَلِيًّا مُّرْشِدًا", tafseer: "ترى الشمس عند شروقها تميل عن كهفهم يميناً وعند غروبها تتركهم شمالاً لئلا تؤذيهم، وهم في متسع منه." },
            { id: 18, text: "وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ ۚ وَنُقَلِّبُهُمْ ذَاتَ الْيَمِينِ وَذَاتَ الشِّمَالِ ۖ وَكَلْبُهُم بَاسِطٌ ذِرَاعَيْهِ بِالْوَصِيدِ ۚ لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا", tafseer: "تظنهم مستيقظين لأعينهم المفتوحة وهم نيام، ونقلبهم لئلا تأكل الأرض أجسادهم، وكلبهم حارس عند الباب." },
            { id: 19, text: "وَكَذَٰلِكَ بَعَثْنَاهُمْ لِيَتَسَاءَلُوا بَيْنَهُمْ ۚ قَالَ قَائِلٌ مِّنْهُمْ كَمْ لَبِثْتُمْ ۖ قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ ۚ قَالُوا رَبُّكُمْ أَعْلَمُ بِمَا لَبِثْتُمْ فَابْعَثُوا أَحَدَكُم بِوَرِقِكُمْ هَٰذِهِ إِلَى الْمَدِينَةِ فَلْيَنظُرْ أَيُّهَا أَزْكَىٰ طَعَامًا فَلْيَأْتِكُم بِرِزْقٍ مِّنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا", tafseer: "وأيقظناهم ليتساءلوا، فقالوا نمنا يوماً أو بعض يوم، ثم بعثوا أحدهم بنقودهم الفضية ليشتري طعماً حلالاً طاهراً بحذر." },
            { id: 20, text: "إِنَّهُمْ إِن يَظْهَرُوا عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِي مِلَّتِهِمْ وَلَن تُفْلِحُوا إِذًا أَبَدًا", tafseer: "إن قومكم إن علموا بمكانكم سيرجمونكم بالحجارة قتلاً أو يجبرونكم على الشرك فلن تفلحوا أبداً." },
            { id: 21, text: "وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوا أَنَّ وَعْدَ اللَّهِ حَقٌّ وَأَنَّ السَّاعَةَ لَا رَيْبَ فِيهَا إِذْ يَتَنَازَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا ابْنُوا عَلَيْهِم بُنْيَانًا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ الَّذِينَ غَلَبُوا عَلَىٰ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًا", tafseer: "أطلعنا الناس عليهم ليعلموا أن وعد الله بالبعث حق، وتنازع الناس في أمرهم فقال أصحاب السلطة لنتخذن عليهم مسجداً." },
            { id: 22, text: "سَيَقُولُونَ ثَلَاثَةٌ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًا بِالْغَيْبِ ۖ وَيَقُولُونَ سَبْعَةٌ وَثَامِنُهُمْ كَلْبُهُمْ ۚ قُل رَّبِّي أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌ ۗ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَاءً ظَاهِرًا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًا", tafseer: "سيختلفون في عددهم تخميناً بالباطل، والصواب أنهم سبعة وثامنهم كلبهم، ولا تجادل في عددهم إلا جدالاً ظاهراً." },
            { id: 23, text: "وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَٰلِكَ غَدًا", tafseer: "ولا تقل لأمر تعتزم فعله في المستقبل: إني فاعل ذلك حتماً غداً." },
            { id: 24, text: "إِلَّا أَن يَشَاءَ اللَّهُ ۚ وَاذْكُر رَّبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰ أَن يَهْدِيَنِ رَبِّي لِأَقْرَبَ مِنْ هَٰذَا رَشَدًا", tafseer: "إلا أن تعلقه بمشيئة الله قائلاً (إن شاء الله)، واذكر ربك إن نسيت واستهدِ به لأقرب سبل الرشاد." },
            { id: 25, text: "وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ وَازْدَادُوا تِسْعًا", tafseer: "ومكث الفتية في كهفهم نياماً ثلاثمائة سنة شمسية، تزيد تسع سنين بالحساب القمري الهجري." },
            { id: 26, text: "قُلِ اللَّهُ أَعْلَمُ بِمَا لَبِثُوا ۖ لَهُ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ ۖ أَبْصِرْ بِهِ وَأَسْمِعْ ۚ مَا لَهُم مِّن دُونِهِ مِن وَلِيٍّ وَلَا يُشْرِكُ فِي حُكْمِهِ أَحَدًا", tafseer: "الله أعلم بمدة لبثهم، يعلم غيب السموات والأرض، ليس للخلق وليّ سواه ولا يشاركه أحد في قضائه." },
            { id: 27, text: "وَاتْلُ مَا أُوحِيَ إِلَيْكَ مِن كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَاتِهِ وَلَن تَجِدَ مِن دُونِهِ مُلْتَحَدًا", tafseer: "واقرأ يا محمد ما أنزل إليك من القرآن، فلا مغير لكلماته التامة، ولن تجد من دون الله ملجأ." },
            { id: 28, text: "وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا ۖ وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا", tafseer: "واصبر نفسك مع فقراء المؤمنين الصالحين، ولا تصرف بصرك عنهم لصحبة أهل الدنيا الغافلين عن ذكر الله." },
            { id: 29, text: "وَقُلِ الْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ ۚ إِنَّا أَعْتَدْنَا لِلظَّالِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا يُغَاثُوا بِمَاءٍ كَالْمُهْلِ يَشْوِي الْوُجُوهَ ۚ بِئْسَ الشَّرَابُ وَسَاءَتْ مُرْتَفَقًا", tafseer: "قل هذا القرآن هو الحق من ربكم، فمن اهتدى فلنفسه ومن كفر فعليها، وتوعد الكافرين بنار يشوي ماؤها الوجوه." },
            { id: 30, text: "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", tafseer: "إن الذين صدقوا بالله وعملوا الأعمال الصالحة لا يضيع الله ثواب إحسانهم أبداً." },
            { id: 31, text: "أُولَٰئِكَ لَهُمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهِمُ الْأَنْهَارُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِن ذَهَبٍ وَيَلْبَسُونَ ثِيَابًا خُضْرًا مِّن سُندُسٍ وَإِسْتَبْرَقٍ مُّتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ ۚ نِعْمَ الثَّوَابُ وَحَسُنَتْ مُرْتَفَقًا", tafseer: "لهم جنات إقامة دائمة، يلبسون الحرير والديباج ويتحلون بالذهب متكئين على السرر المزينة، نعم الجزاء والمستقر." },
            { id: 32, text: "وَاضْرِبْ لَهُم مَّثَلًا رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَابٍ وَحَفَفْنَاهُمَا بِنَخْلٍ وَجَعَلْنَا بَيْنَهُمَا زَرْعًا", tafseer: "واضرب للمشركين مثل رجلين: كافر أعطيناه بستانين عظيمين من الأعناب محاطين بالنخل والزروع." },
            { id: 33, text: "كِلْتَا الْجَنَّتَيْنِ آتَتْ أُكُلَهَا وَلَمْ تَظْلِم مِّنْهُ شَيْئًا ۚ وَفَجَّرْنَا خِلَالَهُمَا نَهَرًا", tafseer: "أثمرت الحديقتان ثمارهما كاملة دون نقص، وفجر الله بينهما نهراً جارياً يسقيهما." },
            { id: 34, text: "وَكَانَ لَهُ ثَمَرٌ فَقَالَ لِصَاحِبِهِ وَهُوَ يُحَاوِرُهُ أَنَا أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا", tafseer: "فاغتر الكافر بكثرة أمواله وقال لصاحبه المؤمن مفاخراً: أنا أكثر منك مالاً وأعز عشيرة وأنصاراً." },
            { id: 35, text: "وَدَخَلَ جَنَّتَهُ وَهُوَ ظَالِمٌ لِّنَفْسِهِ قَالَ مَا أَظُنُّ أَن تَبِيدَ هَٰذِهِ أَبَدًا", tafseer: "ودخل بستانه وهو كافر بنعمة الله جاحداً للبعث فقال: ما أعتقد أن تهلك هذه الجنة أبداً." },
            { id: 36, text: "وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّي لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا", tafseer: "وما أظن القيامة واقعة، وإن بعثت فلي عند الله أفضل من هذا البستان لكرامتي عليه بزعمه." },
            { id: 37, text: "قَالَ لَهُ صَاحِبُهُ وَهُوَ يُحَاوِرُهُ أَكَفَرْتَ بِالَّذِي خَلَقَكَ مِن تُرَابٍ ثُمَّ مِن نُّطْفَةٍ ثُمَّ سَوَّاكَ رَجُلًا", tafseer: "فرد عليه صاحبه المؤمن ناصحاً: كيف تكفر بمن خلق أصلك من تراب ثم طورك نطفة ثم جعلك رجلاً سوياً؟" },
            { id: 38, text: "لَّٰكِنَّا هُوَ اللَّهُ رَبِّي وَلَا أُشْرِكُ بِرَبِّي أَحَدًا", tafseer: "لكنني أنا أقر بأن الله هو ربي المتفرد بالألوهية والربوبية ولا أشرك به أحداً." },
            { id: 39, text: "وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ ۚ إِن تَرَنِ أَنَا أَقَلَّ مِنكَ مَالًا وَوَلَدًا", tafseer: "وهلا حين دخلت بستانك رددت الفضل لله قائلاً (ما شاء الله لا قوة إلا بالله) بدلاً من الغرور والتكبر." },
            { id: 40, text: "فَعَسَىٰ رَبِّي أَن يُؤْتِيَنِ خَيْرًا مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِّنَ السَّمَاءِ فَتُصْبِحَ صَعِيدًا زَلَقًا", tafseer: "فعسى ربي أن يرزقني خيراً من بستانك، وينزل على بستانك صواعق من السماء فتصبح أرضاً جرداء ملساء." },
            { id: 41, text: "أَوْ يُصْبِحَ مَاؤُهَا غَوْرًا فَلَن تَسْتَطِيعَ لَهُ طَلَبًا", tafseer: "أو يغور ماؤها في أعماق الأرض فلا تقدر على استخراجه وسقايتها." },
            { id: 42, text: "وَأُحِيطَ بِثَمَرِهِ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَا أَنفَقَ فِيهَا وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَا لَيْتَنِي لَمْ أُشْرِكْ بِرَبِّي أَحَدًا", tafseer: "وهلكت بساتينه كلها، فأخذ يقلب كفيه ندماً وحسرة على ما أنفق وهي متهدمة قائلاً: يا ليتني لم أشرك بربي." },
            { id: 43, text: "وَلَمْ تَكُن لَّهُ فِئَةٌ يَنصُرُونَهُ مِن دُونِ اللَّهِ وَمَا كَانَ مُنتَصِرًا", tafseer: "ولم تكن له عشيرة ولا أنصار يمنعونه من عقاب الله، وما كان بقادر على نصرة نفسه." },
            { id: 44, text: "هُنَالِكَ الْوَلَايَةُ لِلَّهِ الْحَقِّ ۚ هُوَ خَيْرٌ ثَوَابًا وَخَيْرٌ عُقْبًا", tafseer: "في ذلك الموقف النصرة والحكم لله الحق وحده، هو خير جزاءً لأوليائه وخير عاقبة." },
            { id: 45, text: "وَاضْرِبْ لَهُم مَّثَلَ الْحَيَاةِ الدُّنْيَا كَمَاءٍ أَنزَلْنَاهُ مِنَ السَّمَاءِ فَاخْتَلَطَ بِهِ نَبَاتُ الْأَرْضِ فَأَصْبَحَ هَشِيمًا تَذْرُوهُ الرِّيَاحُ ۗ وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا", tafseer: "واضرب مثل الدنيا في سرعة زوالها بنبات اخضر بماء المطر ثم يبس وتفتت فطيرته الرياح." },
            { id: 46, text: "الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا ۖ وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا", tafseer: "المال والأولاد زينة فانية، والأعمال الصالحة الباقية (كالطاعات والتسبيح) خير ثواباً وأملاً عند الله." },
            { id: 47, text: "وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا", tafseer: "واذكر يوم القيامة حين نقلع الجبال وتستوي الأرض ونجمع الخلائق أجمعين للحساب فلا نترك أحداً." },
            { id: 48, text: "وَعُرِضُوا عَلَىٰ رَبِّكَ صَفًّا لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَاكُمْ أَوَّلَ مَرَّةٍ ۚ بَلْ زَعَمْتُمْ أَلَّن نَّجْعَلَ لَكُم مَّوْعِدًا", tafseer: "ويعرض الخلق على الله صفاً ويقال لهم: جئتمونا حفاة عراة فرادى، وكنتم تنكرون هذا البعث في الدنيا." },
            { id: 49, text: "وَوُضِعَ الْكِتَابُ فَتَرَى الْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَا وَيْلَتَنَا مَالِ هَٰذَا الْكِتَابِ لَا يُغَادِرُ صَغِيرَةً وَلَا كَبِيرَةً إِلَّا أَحْصَاهَا ۚ وَوَجَدُوا مَا عَمِلُوا حَاضِرًا ۗ وَلَا يَظْلِمُ رَبُّكَ أَحَدًا", tafseer: "وتوضع صحائف الأعمال فيفزع المجرمون مما سُجل عليهم من الذنوب، ووجدوا أعمالهم حاضرة ولا يظلم ربك أحداً." },
            { id: 50, text: "وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كَانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ ۗ أَفَتَتَّخِذُونَهُ وَذُرِّيَّتَهُ أَوْلِيَاءَ مِن دُونِي وَهُمْ لَكُمْ عَدُوٌّ ۚ بِئْسَ لِلظَّالِمِينَ بَدَلًا", tafseer: "واذكر أمر الله بالسجود لآدم فامتنع إبليس تكبراً وخروجاً عن طاعة الله، أفاتتخذونه وذريته أعواناً وهم أعداؤكم؟" },
            { id: 51, text: "مَّا أَشْهَدتُّهُمْ خَلْقَ السَّمَاوَاتِ وَالْأَرْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ الْمُضِلِّينَ عَضُدًا", tafseer: "ما أحضرت الشياطين خلق السموات والأرض ولا خلق بعضهم بعضاً، وما كنت لمتخذ الشياطين المضلين أعواناً." },
            { id: 52, text: "وَيَوْمَ يَقُولُ نَادُوا شُرَكَائِيَ الَّذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا لَهُمْ وَجَعَلْنَا بَيْنَهُم مَّوْبِقًا", tafseer: "ويوم يقول الله للمشركين نادوا آلهتكم لتشفع لكم، فيدعونها فلا تجيبهم، وجعلنا بينهم مهلكاً في جهنم." },
            { id: 53, text: "وَرَأَى الْمُجْرِمُونَ النَّارَ فَظَنُّوا أَنَّهُم مُّوَاقِعُوهَا وَلَمْ يَجِدُوا عَنْهَا مَصْرِفًا", tafseer: "وشاهد الكافرون النار فأيقنوا أنهم واقعون فيها لا محالة، ولم يجدوا عنها مهرباً ولا منجى." },
            { id: 54, text: "وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِلنَّاسِ مِن كُلِّ مَثَلٍ ۚ وَكَانَ الْإِنسَانُ أَكْثَرَ شَيْءٍ جَدَلًا", tafseer: "ولقد وضحنا في هذا القرآن للناس كل مثل وموعظة، ولكن الإنسان بطبعه كثير الجدال بالباطل." },
            { id: 55, text: "وَمَا مَنَعَ النَّاسَ أَن يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ وَيَسْتَغْفِرُوا رَبَّهُمْ إِلَّا أَن تَأْتِيَهُمْ سُنَّةُ الْأَوَّلِينَ أَوْ يَأْتِيَهُمُ الْعَذَابُ قُبُلًا", tafseer: "وما منع المشركين من الإيمان بعد مجيء الرسول إلا طلبهم أن يعذبوا كالأمم السابقة أو يأتيهم العذاب عياناً." },
            { id: 56, text: "وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ ۚ وَيُجَادِلُ الَّذِينَ كَفَرُوا بِالْبَاطِلِ لِيُدْحِضُوا بِهِ الْحَقَّ ۖ وَاتَّخَذُوا آيَاتِي وَمَا أُنذِرُوا هُزُوًا", tafseer: "وما نرسل الرسل إلا مبشرين لأهل الطاعة ومنذرين لأهل الكفر، ولكن الكفار يجادلون ليزيلوا الحق بالباطل مستهزئين." },
            { id: 57, text: "وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِآيَاتِ رَبِّهِ فَأَعْرَضَ عَنْهَا وَنَسِيَ مَا قَدَّمَتْ يَدَاهُ ۚ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا ۖ وَإِن تَدْعُهُمْ إِلَى الْهُدَىٰ فَلَن يَهْتَدُوا إِذًا أَبَدًا", tafseer: "لا أحد أشد ظلماً ممن وُعظ بآيات ربه فأعرض وتناسى ذنوبه، فختم الله على قلوبهم وأسماعهم جزاء كفرهم." },
            { id: 58, text: "وَرَبُّكَ الْغَفُورُ ذُو الرَّحْمَةِ ۖ لَوْ يُؤَاخِذُهُم بِمَا كَسَبُوا لَعَجَّلَ لَهُمُ الْعَذَابَ ۚ بَل لَّهُم مَّوْعِدٌ لَّن يَجِدُوا مِن دُونِهِ مَوْئِلًا", tafseer: "وربك غفور رحيم، لو يؤاخذهم بذنوبهم لعجل لهم العذاب بالدنيا، بل جعل لهم موعداً للقيامة لا ملجأ منه." },
            { id: 59, text: "وَتِلْكَ الْقُرَىٰ أَهْلَكْنَاهُمْ لَمَّا ظَلَمُوا وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًا", tafseer: "وتلك القرى السابقة (كقوم عاد وثمود) أهلكناهم لما كفروا وجعلنا لهلاكهم أجلاً محدداً." },
            { id: 60, text: "وَإِذْ قَالَ مُوسَىٰ لِفَتَاهُ لَا أَبْرَحُ حَتَّىٰ أَبْلُغَ مَجْمَعَ الْبَحْرَيْنِ أَوْ أَمْضِيَ حُقُبًا", tafseer: "واذكر حين قال موسى لخادمه يوشع بن نون: لن أتوقف عن السير حتى أصل ملتقى البحرين أو أسير زمناً طويلاً." },
            { id: 61, text: "فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ سَرَبًا", tafseer: "فلما وصلا ملتقى البحرين نسيا سمكتهما التي يتزودان بها، فدبت فيها الحياة ونزلت في البحر متخذة مسلكاً كالنفق." },
            { id: 62, text: "فَلَمَّا جَاوَزَا قَالَ لِفَتَاهُ آتِنَا غَدَاءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَٰذَا نَصَبًا", tafseer: "فلما جاوزا المكان قال موسى لخادمه: أحضر لنا غداءنا فقد أصابنا من هذا السفر تعب ومشقة." },
            { id: 63, text: "قَالَ أَرَأَيْتَ إِذْ أَوَيْنَا إِلَى الصَّخْرَةِ فَإِنِّي نَسِيتُ الْحُوتَ وَمَا أَنسَانِيهُ إِلَّا الشَّيْطَانُ أَنْ أَذْكُرَهُ ۚ وَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ عَجَبًا", tafseer: "قال الفتى: تذكر حين استرحنا عند الصخرة؟ لقد حييت السمكة وقفزت بالبحر وأنساني الشيطان إخبارك بذلك أمراً عجباً." },
            { id: 64, text: "قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ ۚ فَارْتَدَّا عَلَىٰ آثَارِهِمَا قَصَصًا", tafseer: "قال موسى: ذلك الموضع هو ما نطلبه للقاء العبد الصالح، فرجعا يتتبعان أقدامهما حتى بلغا الصخرة." },
            { id: 65, text: "فَوَجَدَا عَبْدًا مِّنْ عِبَادِنَا آتَيْنَاهُ رَحْمَةً مِّنْ عِندِنَا وَعَلَّمْنَاهُ مِن لَّدُنَّا عِلْمًا", tafseer: "فوجدا هناك العبد الصالح (الخضر عليه السلام) الذي آتاه الله رحمة ونبوة وعلماً لدنياً خاصاً." },
            { id: 66, text: "قَالَ لَهُ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰ أَن تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا", tafseer: "فقال موسى بأدب وتواضع: هل تأذن لي بمرافقتك لتعلمني مما علمك الله من العلم النافع والرشد؟" },
            { id: 67, text: "قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا", tafseer: "قال الخضر: إنك يا موسى لن تقدر على الصبر على تصرفاتي لأنك ترى ظواهر الأمور دون بواطنها." },
            { id: 68, text: "وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِ خُبْرًا", tafseer: "وكيف تصبر على أمور تراها منكرة في الظاهر وليس عندك علم بأسبابها وحكمتها الباطنة؟" },
            { id: 69, text: "قَالَ سَتَجِدُنِي إِن شَاءَ اللَّهُ صَابِرًا وَلَا أَعْصِي لَكَ أَمْرًا", tafseer: "أجاب موسى: ستجدني إن شاء الله صابراً على ما أرى ولن أخالف لك أمراً." },
            { id: 70, text: "قَالَ فَإِنِ اتَّبَعْتَنِي فَلَا تَسْأَلْنِي عَن شَيْءٍ حَتَّىٰ أُحْدِثَ لَكَ مِنْهُ ذِكْرًا", tafseer: "فاشترط الخضر: إن رافقتني فلا تسألني عن أي تصرف أفعله حتى أكون أنا البادئ ببيانه لك." },
            { id: 71, text: "فَانطَلَقَا حَتَّىٰ إِذَا رَكِبَا فِي السَّفِينَةِ خَرَقَهَا ۖ قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْئًا إِمْرًا", tafseer: "فركبا في سفينة فقام الخضر بنزع لوح منها فأنكر موسى: أخرقتها لتغرق ركابها؟ لقد فعلت أمراً عظيماً منكراً." },
            { id: 72, text: "قَالَ أَلَمْ أَقُلْ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا", tafseer: "ذكره الخضر بالشرط قائلاً: ألم أقل لك من البداية إنك لن تستطيع الصبر على ما ترى؟" },
            { id: 73, text: "قَالَ لَا تُؤَاخِذْنِي بِمَا نَسِيتُ وَلَا تُرْهِقْنِي مِنْ أَمْرِي عُسْرًا", tafseer: "اعتذر موسى قائلاً: لا تؤاخذني بنسياني لشرطك ولا تشدد عليّ في صحبتك ويسر أمري." },
            { id: 74, text: "فَانطَلَقَا حَتَّىٰ إِذَا لَقِيَا غُلَامًا فَقَتَلَهُ قَالَ أَقَتَلْتَ نَفْسًا زَكِيَّةً بِغَيْرِ نَفْسٍ لَّقَدْ جِئْتَ شَيْئًا نُّكْرًا", tafseer: "فسارا حتى وجدا غلاماً صغيراً فقتله الخضر فغضب موسى: أقتلت نفساً طاهرة لم تقتل أحداً؟ لقد فعلت أمراً منكراً جداً." },
            { id: 75, text: "قَالَ أَلَمْ أَقُل لَّكَ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا", tafseer: "أكد عليه الخضر ثانية بلهجة أشد: ألم أقل لك إنك لن تستطيع معي صبراً؟" },
            { id: 76, text: "قَالَ إِن سَأَلْتُكَ عَن شَيْءٍ بَعْدَهَا فَلَا تُصَاحِبْنِي ۖ قَدْ بَلَغْتَ مِن لَّدُنِّي عُذْرًا", tafseer: "قال موسى: إن سألتك عن شيء بعد هذه المرة ففارقني، فقد أعذرتني بقبولك اعتذاري مرتين." },
            { id: 77, text: "فَانطَلَقَا حَتَّىٰ إِذَا أَتَيَا أَهْلَ قَرْيَةٍ اسْتَطْعَمَا أَهْلَهَا فَأَبَوْا أَن يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَن يَنقَضَّ فَأَقَامَهُ ۖ قَالَ لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا", tafseer: "فدخلا قرية فبخل أهلها بإطعامهما، فرأى الخضر جداراً مائلاً سيسقط فأصلحه، فقال موسى: لو طلبت منهم أجراً لنشتري به طعاماً." },
            { id: 78, text: "قَالَ هَٰذَا فِرَاقُ بَيْنِي وَبَيْنِكَ ۚ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْرًا", tafseer: "قال الخضر: هذا وقت الفراق بيننا بحسب شرطك، وسأخبرك بحكمة ما لم تطق الصبر عليه." },
            { id: 79, text: "أَمَّا السَّفِينَةُ فَكَانَتْ لِمَسَاكِينَ يَعْمَلُونَ فِي الْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَاءَهُم مَّلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا", tafseer: "السفينة كانت لمساكين فخرقتها لتبدو معيبة لأن أمامهم ملكاً ظالماً يغتصب كل سفينة صالحة." },
            { id: 80, text: "وَأَمَّا الْغُلَامُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَا أَن يُرْهِقَهُمَا طُغْيَانًا وَكُفْرًا", tafseer: "والغلام كان في علم الله كافراً ولو كبر لأتعب والديه المؤمنين وحملهما على الكفر بحبهما له." },
            { id: 81, text: "فَأَرَدْنَا أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكَاةً وَأَقْرَبَ رُحْمًا", tafseer: "فأراد الله أن يرزقهما ولداً صالحاً تقياً باراً بهما خيراً من ذلك الغلام." },
            { id: 82, text: "وَأَمَّا الْجِدَارُ فَكَانَ لِغُلَامَيْنِ يَتِيمَيْنِ فِي الْمَدِينَةِ وَكَانَ تَحْتَهُ كَنزٌ لَّهُمَا وَكَانَ أَبُوهُمَا صَالِحًا فَأَرَادَ رَبُّكَ أَن يَبْلُغَا أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنزَهُمَا رَحْمَةً مِّن رَّبِّكَ ۚ وَمَا فَعَلْتُهُ عَنْ أَمْرِي ۚ ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْرًا", tafseer: "والجدار كان ليتيمين تحته كنز مدفون لهما بصلاح أبيهما، فأصلحته ليحفظ كنزهما حتى يبلغا رشدهما بأمر الله." },
            { id: 83, text: "وَيَسْأَلُونَكَ عَن ذِي الْقَرْنَيْنِ ۖ قُلْ سَأَتْلُو عَلَيْكُم مِّنْهُ ذِكْرًا", tafseer: "ويسألك المشركون واليهود عن خبر الملك الصالح ذي القرنين، قل سأتلو عليكم من خبره موعظة وعلماً." },
            { id: 84, text: "إِنَّا مَكَّنَّا لَهُ فِي الْأَرْضِ وَآتَيْنَاهُ مِن كُلِّ شَيْءٍ سَبَبًا", tafseer: "إنا بسطنا له ملكه وهيأنا له من الأسباب والقوة ما يبلغ به مقاصده وفتوحاته في الأرض." },
            { id: 85, text: "فَأَتْبَعَ سَبَبًا", tafseer: "فأخذ بتلك الأسباب وسار بجيشه متجهاً نحو مغرب الشمس." },
            { id: 86, text: "حَتَّىٰ إِذَا بَلَغَ مَغْرِبَ الشَّمْسِ وَجَدَهَا تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ وَوَجَدَ عِندَهَا قَوْمًا ۗ قُلْنَا يَا ذَا الْقَرْنَيْنِ إِمَّا أَن تُعَذِّبَ وَإِمَّا أَن تَتَّخِذَ فِيهِمْ حُسْنًا", tafseer: "فلما وصل أقصى الغرب رأى الشمس كأنها تغرب في بحر كدر ذي طين أسود، وخيره الله في حكم قومها الكافرين." },
            { id: 87, text: "قَالَ أَمَّا مَن ظَلَمَ فَسَوْفَ نُعَذِّبُهُ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِ فَيُعَذِّبُهُ عَذَابًا نُّكْرًا", tafseer: "فحكم بالعدل: من كفر وظلم سنعاقبه بالقتل ثم يرجع إلى ربه فيعذبه في جهنم عذاباً فظيعاً." },
            { id: 88, text: "وَأَمَّا مَنْ آمَنَ وَعَمِلَ صَالِحًا فَلَهُ جَزَاءً الْحُسْنَىٰ ۖ وَسَنَقُولُ لَهُ مِنْ أَمْرِنَا يُسْرًا", tafseer: "وأما من آمن بالله وعمل الصالحات فله الجنة ونعاملهم باليسر والإحسان." },
            { id: 89, text: "ثُمَّ أَتْبَعَ سَبَبًا", tafseer: "ثم سلك طريقاً ثانياً آخذاً بالأسباب متوجهاً نحو مشرق الشمس." },
            { id: 90, text: "حَتَّىٰ إِذَا بَلَغَ مَطْلِعَ الشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًا", tafseer: "حتى إذا بلغ مطلع الشمس وجدها تطلع على قوم بدائيين لا بيوت ولا شجر يسترهم من حر الشمس." },
            { id: 91, text: "كَذَٰلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا", tafseer: "كذلك كان أمره، وقد أحاط علمنا بكل ما يملكه ذو القرنين من الجيوش والأسباب والعتاد." },
            { id: 92, text: "ثُمَّ أَتْبَعَ سَبَبًا", tafseer: "ثم سلك طريقاً ثالثاً متجهاً نحو الشمال بين الجبلين العظيمين." },
            { id: 93, text: "حَتَّىٰ إِذَا بَلَغَ بَيْنَ السَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًا", tafseer: "حتى إذا وصل بين جبلين متقابلين وجد قوماً لا يفهمون لغة غيرهم لغرابة لسانهم وانعزالهم." },
            { id: 94, text: "قَالُوا يَا ذَا الْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِي الْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّا", tafseer: "قالوا بمساعدة مترجم: إن يأجوج ومأجوج يفسدون بقتلنا وتخريب أرضنا، فهل نجعل لك مالاً لتبني بيننا سداً منيعاً؟" },
            { id: 95, text: "قَالَ مَا مَكَّنِّي فِيهِ رَبِّي خَيْرٌ فَأَعِينُونِي بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا", tafseer: "قال بتعفف: ما بسطه الله لي من الملك والمال خير من مالكم، ولكن أعينوني بالعمال والآلات لأبني حاجزاً قوياً." },
            { id: 96, text: "آتُونِي زُبَرَ الْحَدِيدِ ۖ حَتَّىٰ إِذَا سَاوَىٰ بَيْنَ الصَّدَفَيْنِ قَالَ انفُخُوا ۖ حَتَّىٰ إِذَا جَعَلَهُ نَارًا قَالَ آتُونِي أُفْرِغْ عَلَيْهِ قِطْرًا", tafseer: "أحضروا قطع الحديد ورصفوها بين الجبلين، وأوقدوا النار ونفخوا بالكير حتى احمر الحديد، وصب عليه النحاس المذاب فالتحم." },
            { id: 97, text: "فَمَا اسْطَاعُوا أَن يَظْهَرُوهُ وَمَا اسْتَطَاعُوا لَهُ نَقْبًا", tafseer: "فما استطاعت قبائل يأجوج ومأجوج تسلق السد لارتفاعه وملاسته، وما استطاعوا إحداث خرق فيه لصلابته." },
            { id: 98, text: "قَالَ هَٰذَا رَحْمَةٌ مِّن رَّبِّي ۖ فَإِذَا جَاءَ وَعْدُ رَبِّي جَعَلَهُ دَكَّاءَ ۖ وَكَانَ وَعْدُ رَبِّي حَقًّا", tafseer: "قال ذو القرنين: هذا السد رحمة من ربي لدفع شرهم، فإذا حان وقت خروجهم عند القيامة جعله الله مدكوكاً مستوياً بالأرض." },
            { id: 99, text: "وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍ يَمُوجُ فِي بَعْضٍ ۖ وَنُفِخَ فِي الصُّورِ فَجَمَعْنَاهُمْ جَمْعًا", tafseer: "ويخرج يأجوج ومأجوج يموجون بالخلائق لكثرتهم واضطرابهم، ثم ينفخ إسرافيل في البوق فنجلب الخلائق للحساب." },
            { id: 100, text: "وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٍ لِّلْكَافِرِينَ عَرْضًا", tafseer: "وأبرزنا جهنم للكافرين يشاهدونها بأعينهم عياناً ليزدادوا رعباً وحسرة." },
            { id: 101, text: "الَّذِينَ كَانَتْ أَعْيُنُهُمْ فِي غِطَاءٍ عَن ذِكْرِي وَكَانُوا لَا يَسْتَطِيعُونَ سَمْعًا", tafseer: "الذين كانت قلوبهم وبصائرهم في الدنيا معصوبة عن تدبر آياتي وكانوا ينفرون من سماع الحق كالصم." },
            { id: 102, text: "أَفَحَسِبَ الَّذِينَ كَفَرُوا أَن يَتَّخِذُوا عِبَادِي مِن دُونِي أَوْلِيَاءَ ۚ إِنَّا أَعْتَدْنَا جَهَنَّمَ لِلْكَافِرِينَ نُزُلًا", tafseer: "أفظن الكافرون أن اتخاذهم للملائكة أو عيسى آلهة سينجيهم؟ إنا هيأنا جهنم ضيافة ومنزلاً للكافرين." },
            { id: 103, text: "قُلْ هَلْ نُنَبِّئُكُم بِالْأَخْسَرِينَ أَعْمَالًا", tafseer: "قل يا محمد: هل نخبركم بأشد الناس خسراناً وضياعاً لأعمالهم يوم القيامة؟" },
            { id: 104, text: "الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا", tafseer: "هم الذين بطل عملهم في الدنيا لكفرهم وبدعهم وهم يظنون جهلاً أنهم على هدى وصواب." },
            { id: 105, text: "أُولَٰئِكَ الَّذِينَ كَفَرُوا بِآيَاتِ رَبِّهِمْ وَلِقَائِهِ فَحَبِطَتْ أَعْمَالُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ الْقِيَامَةِ وَزْنًا", tafseer: "أولئك جحدوا بدلائل توحيد ربهم وأنكروا البعث فبطلت أعمالهم، ولا نقيم لهم يوم القيامة أي قيمة ولا وزناً." },
            { id: 106, text: "ذَٰلِكَ جَزَاؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا وَاتَّخَذُوا آيَاتِي وَرُسُلِي هُزُوًا", tafseer: "ذلك المصير المهين هو جزاؤهم في نار جهنم بسبب كفرهم واستهزائهم بالقرآن وبالرسل الكرام." },
            { id: 107, text: "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", tafseer: "إن الذين صدقوا الله ورسوله وعملوا الصالحات كانت لهم أعلى درجات الجنة (الفردوس) منزلاً وضيافة." },
            { id: 108, text: "خَالِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًا", tafseer: "مقيمين فيها خلوداً أبدياً، لا يطلبون عنها تحولاً ولا بدلاً لكمال سعادتهم ونعيمهم." },
            { id: 109, text: "قُل لَّوْ كَانَ الْبَحْرُ مِدَادًا لِّكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا", tafseer: "قل لو جعل ماء البحر حبراً لكتابة كلمات الله وحكمه لنفد ماء البحر قبل أن تنفد كلمات الله ولو زدنا بمثله بحاراً أخرى." },
            { id: 110, text: "قُلْ إِنَّمَا أَنَا بَشَرٌ مِّثْلُكُمْ يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا", tafseer: "قل إنما أنا رسول وبشر يوحي إلي ربي أن إلهكم إله واحد، فمن كان يطمع في ثواب ربه فليعمل عملاً خالصاً موافقاً للشرع ولا يشرك بربه أحداً." }
        ];

        let appConfig = JSON.parse(localStorage.getItem('quran_kahf_complete_v110_final_bottom')) || {
            activeIdx: 0,
            bookmarkedIds: [],
            themeMode: "light"
        };

        function persistState() {
            localStorage.setItem('quran_kahf_complete_v110_final_bottom', JSON.stringify(appConfig));
            renderInterface();
        }

        function toggleTheme() {
            appConfig.themeMode = appConfig.themeMode === 'light' ? 'dark' : 'light';
            applyThemeStyles();
            persistState();
        }

        function applyThemeStyles() {
            const themeBtnNode = document.getElementById('themeBtn');
            if (appConfig.themeMode === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtnNode.innerText = '🌙 ليلي';
            } else {
                document.body.classList.remove('dark-mode');
                themeBtnNode.innerText = '☀️ نهاري';
            }
        }

        function navigateVerses(step) {
            let target = appConfig.activeIdx + step;
            if (target >= 0 && target < quranAlKahfData.length) {
                appConfig.activeIdx = target;
                persistState();
            }
        }

        function jumpStep(val) {
            if (val === 'start') {
                appConfig.activeIdx = 0;
            } else {
                let target = appConfig.activeIdx + val;
                if (target < 0) target = 0;
                if (target >= quranAlKahfData.length) target = quranAlKahfData.length - 1;
                appConfig.activeIdx = target;
            }
            persistState();
        }

        function toggleBookmarkCurrent() {
            const currentObj = quranAlKahfData[appConfig.activeIdx];
            const foundIdx = appConfig.bookmarkedIds.indexOf(currentObj.id);
            if (foundIdx === -1) {
                appConfig.bookmarkedIds.push(currentObj.id);
            } else {
                appConfig.bookmarkedIds.splice(foundIdx, 1);
            }
            persistState();
        }

        let isReviewMode = false;
        function toggleReviewView() {
            isReviewMode = !isReviewMode;
            const readerNode = document.getElementById('readerPanel');
            const reviewNode = document.getElementById('reviewPanel');

            if (isReviewMode) {
                readerNode.classList.add('hidden');
                reviewNode.classList.add('active');
                buildReviewList();
            } else {
                readerNode.classList.remove('hidden');
                reviewNode.classList.remove('active');
            }
        }

        function jumpToSpecificVerse(id) {
            const foundIdx = quranAlKahfData.findIndex(item => item.id === id);
            if (foundIdx !== -1) {
                appConfig.activeIdx = foundIdx;
                toggleReviewView();
                persistState();
            }
        }

        function renderInterface() {
            applyThemeStyles();

            const currentObj = quranAlKahfData[appConfig.activeIdx];
            const totalCount = quranAlKahfData.length;

            document.getElementById('progressLabel').innerText = `الآية ${appConfig.activeIdx + 1} من ${totalCount}`;
            document.getElementById('verseNumDisplay').innerText = `الآية ${currentObj.id}`;
            document.getElementById('ayahTextDisplay').innerText = currentObj.text;
            document.getElementById('tafsirBodyContent').innerText = currentObj.tafseer;

            document.getElementById('prevBtnNode').disabled = appConfig.activeIdx === 0;
            document.getElementById('nextBtnNode').disabled = appConfig.activeIdx === totalCount - 1;

            const isBookmarked = appConfig.bookmarkedIds.includes(currentObj.id);
            const bookmarkBtnNode = document.getElementById('bookmarkBtnNode');
            if (isBookmarked) {
                bookmarkBtnNode.innerText = '⭐ محفوظة';
                bookmarkBtnNode.classList.add('bookmarked');
            } else {
                bookmarkBtnNode.innerText = '⭐ حفظ';
                bookmarkBtnNode.classList.remove('bookmarked');
            }

            document.getElementById('savedCounter').innerText = appConfig.bookmarkedIds.length;
        }

        function buildReviewList() {
            const containerNode = document.getElementById('reviewItemsContainer');
            containerNode.innerHTML = '';

            if (appConfig.bookmarkedIds.length === 0) {
                containerNode.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:40px 0;">لا توجد آيات محفوظة للمراجعة حالياً.</p>';
                return;
            }

            appConfig.bookmarkedIds.forEach(id => {
                const item = quranAlKahfData.find(v => v.id === id);
                if (item) {
                    containerNode.innerHTML += `
                        <div class="review-item" onclick="jumpToSpecificVerse(${item.id})">
                            <div>
                                <strong style="color:var(--gold-primary); font-size:13px;">الآية ${item.id}</strong>
                                <div style="font-size:15px; font-family:'Amiri', serif; margin-top:3px; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px;">${item.text}</div>
                            </div>
                            <span style="font-size:12px; color:var(--gold-primary); font-weight:700;">انتقال ➔</span>
                        </div>
                    `;
                }
            });
        }

        // محرك السحب اللمسي
        const cardArea = document.getElementById('quranCardArea');
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        cardArea.addEventListener('touchstart', (e) => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
        }, { passive: true });

        cardArea.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            handleSwipeGesture(startX, startY, endX, endY);
        }, { passive: true });

        cardArea.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
            isDragging = true;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const endX = e.clientX;
            const endY = e.clientY;
            handleSwipeGesture(startX, startY, endX, endY);
        });

        function handleSwipeGesture(x1, y1, x2, y2) {
            const diffX = x2 - x1;
            const diffY = y2 - y1;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                if (diffX < 0) {
                    navigateVerses(1);
                } else {
                    navigateVerses(-1);
                }
            }
        }

        // --- تسجيل Service Worker لتفعيل التثبيت الكامل في اللانشر ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installToLauncher() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                });
            } else {
                alert("لتثبيت التطبيق على الشاشة بملء الشاشة:\nاضغط على خيارات المتصفح (⋮) ثم اختر 'Install app' أو 'تثبيت التطبيق'.");
            }
        }

        window.onload = function() {
            renderInterface();
        };
    </script>
</body>
</html>
